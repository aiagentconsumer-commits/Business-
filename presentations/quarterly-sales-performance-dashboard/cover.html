<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { 
      width: 1280px; 
      min-height: 720px; 
      background: #0B1320; 
      display: flex; 
      flex-direction: column; 
      position: relative;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      color: #F4F1EA;
    }
    
    /* Background Texture Effect */
    .bg-texture {
      position: absolute;
      top: 0;
      right: 0;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, #0B1320 0%, rgba(11, 19, 32, 0.4) 100%),
                  url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&q=80&w=1280');
      background-size: cover;
      opacity: 0.3;
      z-index: 0;
    }

    .header-zone {
      padding-top: 40px;
      padding-left: 40px;
      padding-right: 40px;
      display: flex;
      justify-content: flex-end;
      z-index: 10;
    }

    .motif {
      font-size: 12px;
      color: #FFB300;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }

    .main-content {
      flex: 1;
      padding-left: 40px;
      padding-right: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 10;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 82px;
      line-height: 1.1;
      max-width: 800px;
      margin-bottom: 24px;
    }

    .accent-rule {
      width: 120px;
      height: 4px;
      background: #00E5FF;
      margin-bottom: 40px;
    }

    .subtitle {
      font-size: 24px;
      font-weight: 400;
      color: #8C9BB0;
      margin-bottom: 8px;
    }

    .metadata {
      font-size: 18px;
      color: #F4F1EA;
      display: flex;
      gap: 32px;
      margin-top: 40px;
    }

    .metadata-item span {
      color: #8C9BB0;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="bg-texture"></div>
    
    <div class="header-zone">
      <div class="motif">FY2026 SAMPLE DATA</div>
    </div>

    <div class="main-content">
      <div class="subtitle">Fiscal Year Performance Review</div>
      <h1>Quarterly Sales Performance Dashboard</h1>
      <div class="accent-rule"></div>
      
      <div class="metadata">
        <div class="metadata-item"><span>Reporting Period:</span> Q3 FY2026</div>
        <div class="metadata-item"><span>Generated:</span> Sep 26, 2026</div>
        <div class="metadata-item"><span>Status:</span> Strategic Review</div>
      </div>
    </div>
  </div>
</body>
</html>
